
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create a professional portfolio with Portfolio Builder Pro. Build your portfolio, customize its design and export it as a website or PDF for free.">
<meta name="theme-color" content="#f5f7fb">
<title>Portfolio Builder Pro | Create Your Portfolio</title>

<style>
:root{
  --bg:#f4f6fb;
  --surface:#fff;
  --text:#172033;
  --muted:#788297;
  --line:#e7eaf1;
  --primary:#365cf5;
  --primary-dark:#2446d9;
  --soft:#edf1ff;
  --radius:16px;
  --shadow:0 8px 30px rgba(26,39,75,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{
  height:68px;
  padding:0 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#4266ff,#774df5);
  color:white;display:grid;place-items:center;font-size:19px;
}
.top-actions{display:flex;align-items:center;gap:9px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:10px;padding:10px 14px;font-weight:650;font-size:13px;
  transition:.2s;
}
.btn:hover{border-color:#bdc8ee;transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.soft{background:var(--soft);color:var(--primary);border-color:transparent}
.btn.danger{color:#d33b50}
.btn.small{padding:7px 10px;font-size:12px}
.app{max-width:1600px;margin:auto;padding:22px}
.welcome{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin:4px 0 20px;
}
.welcome h1{font-size:25px;margin:0 0 6px;letter-spacing:-.7px}
.welcome p{margin:0;color:var(--muted);font-size:13px}
.status{font-size:12px;color:#24835b;display:flex;align-items:center;gap:7px}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#2bb77b}
.workspace{
  display:grid;grid-template-columns:205px minmax(310px,440px) minmax(380px,1fr);
  gap:16px;align-items:start;
}
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.steps-panel{padding:17px;position:sticky;top:90px}
.panel-heading{font-size:12px;font-weight:800;color:#9aa3b5;letter-spacing:1px;text-transform:uppercase;margin:3px 0 15px}
.step{
  width:100%;border:0;background:transparent;text-align:left;
  padding:11px 9px;border-radius:11px;display:flex;gap:11px;
  align-items:center;color:#667188;margin:3px 0;font-size:13px;font-weight:650;
}
.step:hover{background:#f7f8fc}
.step.active{background:var(--soft);color:var(--primary)}
.step-number{
  width:27px;height:27px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;background:#fff;flex-shrink:0;
}
.step.active .step-number{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .step-number{background:#e8f8f0;border-color:#c7eedb;color:#168253}
.step-progress{height:5px;background:#edf0f5;border-radius:9px;margin:16px 0 8px;overflow:hidden}
.step-progress span{height:100%;display:block;background:var(--primary);width:14%;transition:.3s}
.progress-label{font-size:11px;color:var(--muted)}
.editor-panel{padding:22px;min-height:570px}
.editor-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}
.editor-title h2{font-size:19px;margin:0;letter-spacing:-.4px}
.editor-title p{font-size:12px;color:var(--muted);margin:5px 0 0}
.form-group{margin:0 0 16px}
.form-group label{display:block;font-size:12px;font-weight:700;margin:0 0 7px;color:#414b60}
.form-group small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.field{
  width:100%;border:1px solid #e1e5ed;background:#fff;
  border-radius:10px;padding:11px 12px;color:var(--text);
  outline:none;font-size:13px;transition:.2s;
}
.field:focus{border-color:#8da3ff;box-shadow:0 0 0 3px rgba(54,92,245,.09)}
textarea.field{resize:vertical;min-height:85px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{
  display:flex;justify-content:space-between;gap:10px;
  border-top:1px solid var(--line);padding-top:17px;margin-top:23px;
}
.form-actions .right{display:flex;gap:8px}
.preview-panel{position:sticky;top:90px;overflow:hidden}
.preview-top{
  padding:14px 17px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.preview-top strong{font-size:13px}
.preview-top span{font-size:11px;color:var(--muted)}
.preview-controls{display:flex;align-items:center;gap:7px}
.preview-stage{
  background:#e9edf5;padding:24px;min-height:650px;
  display:flex;justify-content:center;align-items:flex-start;
  overflow:auto;
}
.portfolio{
  width:100%;max-width:720px;min-height:850px;background:#fff;
  box-shadow:0 12px 35px rgba(26,39,75,.13);
  color:#202b40;overflow:hidden;
  --accent:#365cf5;--font:Arial,sans-serif;
  font-family:var(--font);
}
.portfolio-inner{padding:42px 45px}
.p-accent{color:var(--accent)}
.p-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--accent)}
.p-name{font-size:36px;line-height:1.1;letter-spacing:-1.5px;margin:10px 0 9px;font-weight:850}
.p-role{font-size:14px;color:#657087;margin:0 0 17px}
.p-bio{font-size:12px;line-height:1.8;color:#687287;max-width:600px}
.p-contact{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:10px;color:#69758a;margin-top:18px}
.p-section{margin-top:31px}
.p-section-title{
  font-size:12px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase;
  padding-bottom:9px;border-bottom:1px solid #e8ebf1;margin-bottom:15px;
}
.p-item{margin:0 0 17px}
.p-item h4{font-size:13px;margin:0 0 4px}
.p-item .meta{font-size:10px;color:#8b95a8;margin-bottom:7px}
.p-item p{font-size:11px;line-height:1.7;color:#687287;margin:0}
.p-skills{display:flex;flex-wrap:wrap;gap:7px}
.p-skill{
  background:#f0f3fb;color:#47546e;padding:7px 10px;
  border-radius:6px;font-size:10px;font-weight:650;
}
.p-projects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.p-project{border:1px solid #e9edf3;border-radius:9px;overflow:hidden}
.p-project img{width:100%;height:120px;object-fit:contain;background:#f3f5f9;display:block}
.p-project-content{padding:11px}
.p-project h4{font-size:12px;margin:0 0 5px}
.p-project p{font-size:10px;color:#778196;line-height:1.6;margin:0}
.p-hero-image{
  width:112px;height:112px;object-fit:contain;border-radius:50%;
  background:#eef1f7;border:4px solid #fff;box-shadow:0 3px 14px #17203318;
}
.p-image-placeholder{
  width:112px;height:112px;border-radius:50%;background:#eef1f7;
  display:grid;place-items:center;color:#a4aec0;font-size:30px;
}
.layout-modern .p-hero{display:grid;grid-template-columns:1fr 120px;gap:20px;align-items:center}
.layout-modern .portfolio-inner{padding:43px}
.layout-minimal .portfolio-inner{padding:58px 55px}
.layout-minimal .p-name{font-family:Georgia,serif;font-weight:500;font-size:43px}
.layout-minimal .p-section-title{border:0;border-bottom:1px solid #222;letter-spacing:2px}
.layout-bold{background:#fff}
.layout-bold .p-hero{background:#19243b;color:white;margin:-42px -45px 0;padding:45px}
.layout-bold .p-role,.layout-bold .p-bio,.layout-bold .p-contact{color:#c4ccdb}
.layout-bold .p-kicker{color:#a8bbff}
.layout-bold .p-section-title{color:#24324a}
.layout-corporate .p-hero{border-left:5px solid var(--accent);padding-left:22px}
.layout-corporate .p-name{font-size:31px;letter-spacing:-.5px}
.layout-corporate .p-hero-image,.layout-corporate .p-image-placeholder{border-radius:12px}
.mobile-tabs{display:none}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.template-option{
  border:2px solid var(--line);border-radius:12px;padding:9px;
  background:white;text-align:left;transition:.2s;
}
.template-option.selected{border-color:var(--primary);background:#f8f9ff}
.template-mini{height:105px;border-radius:7px;background:#f0f2f8;padding:12px;overflow:hidden}
.mini-line{height:5px;background:#aeb8ce;border-radius:5px;margin:7px 0;width:65%}
.mini-line.short{width:35%}
.mini-line.long{width:90%}
.mini-block{height:22px;width:100%;background:#dce2f0;border-radius:4px;margin-top:10px}
.template-option strong{display:block;font-size:12px;margin:9px 2px 3px}
.template-option small{font-size:10px;color:var(--muted);margin:0 2px}
.dynamic-card{
  border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 13px;
  background:#fff;
}
.dynamic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dynamic-head strong{font-size:13px}
.empty-note{
  padding:20px;border:1px dashed #cbd2df;border-radius:10px;
  text-align:center;color:var(--muted);font-size:12px;
}
.photo-upload{
  border:1px dashed #bbc5d8;border-radius:12px;padding:17px;
  text-align:center;background:#fafbfe;
}
.photo-upload img{width:85px;height:85px;object-fit:contain;background:#edf0f5;border-radius:50%;margin-bottom:8px}
.hidden{display:none!important}
.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-choice{
  width:31px;height:31px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 0 0 1px #dce1eb;cursor:pointer;
}
.color-choice.selected{box-shadow:0 0 0 2px var(--primary)}
.footer-note{text-align:center;color:#9aa3b5;font-size:11px;padding:22px}
@media(max-width:1100px){
  .workspace{grid-template-columns:180px minmax(290px,1fr)}
  .preview-panel{grid-column:1/-1;position:relative;top:auto}
  .preview-stage{min-height:500px}
  .portfolio{max-width:720px}
}
@media(max-width:700px){
  .topbar{padding:0 13px;height:60px}
  .brand{font-size:15px}
  .top-actions .btn{padding:8px 9px;font-size:11px}
  .app{padding:14px}
  .welcome{align-items:flex-start;flex-direction:column}
  .welcome h1{font-size:22px}
  .workspace{display:block}
  .steps-panel{position:static;margin-bottom:12px;padding:12px}
  .steps-list{display:flex;overflow-x:auto;gap:5px}
  .step{min-width:112px;width:auto;padding:8px;font-size:11px}
  .step-number{width:23px;height:23px}
  .steps-panel .panel-heading,.step-progress,.progress-label{display:none}
  .editor-panel{padding:17px;min-height:0;margin-bottom:12px}
  .preview-panel{display:none;position:static}
  .preview-panel.mobile-visible{display:block}
  .mobile-tabs{display:flex;gap:8px;margin-bottom:12px}
  .mobile-tabs button{flex:1}
  .preview-stage{padding:10px;min-height:0}
  .portfolio{min-height:700px}
  .portfolio-inner{padding:24px!important}
  .layout-bold .p-hero{margin:-24px -24px 0;padding:24px}
  .p-name{font-size:28px}
  .layout-minimal .p-name{font-size:34px}
  .p-projects{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
}
@media print{
  body{background:#fff!important}
  .topbar,.welcome,.steps-panel,.editor-panel,.preview-top,.footer-note,.mobile-tabs{display:none!important}
  .app{padding:0!important;max-width:none!important}
  .workspace{display:block!important}
  .preview-panel{display:block!important;position:static!important;border:0!important;box-shadow:none!important}
  .preview-stage{padding:0!important;background:#fff!important;overflow:visible!important;display:block!important}
  .portfolio{width:100%!important;max-width:none!important;min-height:0!important;box-shadow:none!important}
  .portfolio-inner{padding:16mm!important}
  .p-section,.p-item,.p-project{break-inside:avoid}
  @page{size:A4;margin:0}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">P</div> Portfolio Builder Pro</div>
  <div class="top-actions">
    <button class="btn" id="saveBtn">Save Draft</button>
    <button class="btn soft" id="resetBtn">Reset Sample</button>
    <button class="btn primary" id="exportMenuBtn">Export Portfolio ↓</button>
  </div>
</header>

<main class="app">
  <section class="welcome">
    <div>
      <h1>Create your professional portfolio</h1>
      <p>Build it step by step. Your portfolio preview updates as you work.</p>
    </div>
    <div class="status" id="saveStatus">Ready to edit</div>
  </section>

  <div class="mobile-tabs">
    <button class="btn primary" id="editTab">Edit Portfolio</button>
    <button class="btn" id="previewTab">Live Preview</button>
  </div>

  <section class="workspace">
    <aside class="panel steps-panel">
      <div class="panel-heading">Your portfolio</div>
      <div class="steps-list" id="stepsList">
        <button class="step active" data-step="0"><span class="step-number">1</span> Template</button>
        <button class="step" data-step="1"><span class="step-number">2</span> Profile</button>
        <button class="step" data-step="2"><span class="step-number">3</span> Skills</button>
        <button class="step" data-step="3"><span class="step-number">4</span> Experience</button>
        <button class="step" data-step="4"><span class="step-number">5</span> Education</button>
        <button class="step" data-step="5"><span class="step-number">6</span> Projects</button>
        <button class="step" data-step="6"><span class="step-number">7</span> Design & Export</button>
      </div>
      <div class="step-progress"><span id="progressBar"></span></div>
      <div class="progress-label" id="progressLabel">Step 1 of 7</div>
    </aside>

    <section class="panel editor-panel" id="editorPanel">
      <div id="editorContent"></div>
    </section>

    <section class="panel preview-panel" id="previewPanel">
      <div class="preview-top">
        <div><strong>Live portfolio preview</strong><br><span>Changes appear automatically</span></div>
        <div class="preview-controls">
          <button class="btn small" id="zoomOut">−</button>
          <span id="zoomLabel">100%</span>
          <button class="btn small" id="zoomIn">+</button>
        </div>
      </div>
      <div class="preview-stage" id="previewStage">
        <article class="portfolio layout-modern" id="portfolioPreview"></article>
      </div>
    </section>
  </section>
  <div class="footer-note">Portfolio Builder Pro · Create, customize and export your work</div>
</main>

<input type="file" id="profileFile" accept="image/*" class="hidden">
<input type="file" id="projectFile" accept="image/*" class="hidden">

<script>
"use strict";

/* ---------------------------------------
   PORTFOLIO DATA
--------------------------------------- */
const sampleData = {
  template:"modern",
  accent:"#365cf5",
  font:"Arial",
  name:"Alex Morgan",
  role:"UI/UX Designer & Creative Developer",
  email:"alex@example.com",
  phone:"+1 234 567 890",
  location:"New York, USA",
  website:"alexmorgan.com",
  bio:"I am a creative designer and developer who enjoys turning complex problems into simple, beautiful and useful digital experiences. I focus on thoughtful design, clean interfaces and meaningful user experiences.",
  photo:"",
  skills:["UI/UX Design","Figma","HTML & CSS","JavaScript","Prototyping","Responsive Design"],
  experiences:[
    {role:"UI/UX Designer",company:"Creative Studio",date:"2023 – Present",description:"Designed user-friendly digital experiences, created wireframes and prototypes, and collaborated with developers to deliver polished products."}
  ],
  education:[
    {degree:"Bachelor of Design",school:"City University",date:"2019 – 2023",description:"Focused on visual communication, interaction design and digital media."}
  ],
  projects:[
    {title:"Modern Dashboard UI",category:"UI/UX Design",description:"A clean analytics dashboard concept designed to make complex data easier to understand.",image:""},
    {title:"Creative Agency Website",category:"Web Design",description:"A responsive website concept with a strong visual identity and simple navigation.",image:""}
  ]
};

let data = JSON.parse(JSON.stringify(sampleData));
let currentStep = 0;
let zoom = 100;
let activeProjectIndex = 0;

/* ---------------------------------------
   BASIC HELPERS
--------------------------------------- */
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));

function safeURL(value){
  const v = String(value || "").trim();
  if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[\w.-]+\.[a-z]{2,}/i.test(v)) return "https://" + v;
  return "";
}
function setStatus(message){
  $("saveStatus").textContent = message;
}
function field(label,id,value,placeholder="",type="text"){
  return `<div class="form-group">
    <label for="${id}">${label}</label>
    <input class="field" id="${id}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}">
  </div>`;
}
function area(label,id,value,placeholder=""){
  return `<div class="form-group">
    <label for="${id}">${label}</label>
    <textarea class="field" id="${id}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(value)}</textarea>
  </div>`;
}
function sectionHeader(title,subtitle){
  return `<div class="editor-title"><div><h2>${title}</h2><p>${subtitle}</p></div></div>`;
}
function actionButtons(back=true,next=true,nextText="Continue"){
  return `<div class="form-actions">
    <button class="btn" id="backBtn" ${back?"":"disabled"}>${back?"← Back":" "}</button>
    <div class="right">
      ${next?`<button class="btn primary" id="nextBtn">${nextText} →</button>`:""}
    </div>
  </div>`;
}

/* ---------------------------------------
   TEMPLATE SELECTION
--------------------------------------- */
const templates = [
  {id:"modern",name:"Modern Split",desc:"Clean layout with profile image"},
  {id:"minimal",name:"Minimal Editorial",desc:"Elegant typography and whitespace"},
  {id:"bold",name:"Bold Creative",desc:"Strong dark hero and visual style"},
  {id:"corporate",name:"Professional Corporate",desc:"Structured and business focused"}
];

function templateMini(id){
  if(id==="bold") return `<div style="background:#1b2943;padding:12px;border-radius:5px;height:100%">
    <div class="mini-line short" style="background:#9fb3ff"></div><div class="mini-line long" style="background:#fff"></div>
    <div class="mini-line" style="background:#8290a8"></div><div class="mini-block" style="background:#344664"></div></div>`;
  if(id==="minimal") return `<div style="background:#fff;padding:12px;height:100%">
    <div class="mini-line short" style="background:#333"></div><div class="mini-line long" style="background:#333;height:9px"></div>
    <div class="mini-line" style="background:#bbb"></div><div style="height:1px;background:#333;margin-top:15px"></div>
    <div class="mini-block" style="background:#eee"></div></div>`;
  if(id==="corporate") return `<div style="background:#fff;padding:12px;height:100%;border-left:5px solid #365cf5">
    <div class="mini-line short"></div><div class="mini-line long"></div><div class="mini-line"></div>
    <div class="mini-block"></div></div>`;
  return `<div style="background:#fff;padding:12px;height:100%">
    <div style="display:flex;justify-content:space-between"><div style="width:65%"><div class="mini-line short"></div><div class="mini-line long"></div><div class="mini-line"></div></div><div style="width:36px;height:36px;border-radius:50%;background:#dce2f0"></div></div>
    <div class="mini-block"></div></div>`;
}

/* ---------------------------------------
   STEP RENDERING
--------------------------------------- */
function renderStep(){
  const content = $("editorContent");
  $("stepsList").querySelectorAll(".step").forEach((button,index)=>{
    button.classList.toggle("active",index===currentStep);
    button.classList.toggle("done",index<currentStep);
  });
  $("progressBar").style.width = ((currentStep+1)/7*100)+"%";
  $("progressLabel").textContent = `Step ${currentStep+1} of 7`;

  if(currentStep===0){
    content.innerHTML = sectionHeader("Choose your style","Select a design that suits your profession.")+
      `<div class="template-grid">${templates.map(t=>`
        <button class="template-option ${data.template===t.id?"selected":""}" data-template="${t.id}">
          <div class="template-mini">${templateMini(t.id)}</div>
          <strong>${t.name}</strong><small>${t.desc}</small>
        </button>`).join("")}</div>`+
      actionButtons(false,true);
  }

  if(currentStep===1){
    content.innerHTML = sectionHeader("Your profile","Introduce yourself and add your contact information.")+
      `<div class="photo-upload">
        ${data.photo?`<img src="${data.photo}" alt="Profile photo preview">`:`<div style="font-size:30px;margin-bottom:8px">◎</div>`}
        <div style="font-size:12px;font-weight:700">Profile photo</div>
        <div style="font-size:11px;color:#8791a4;margin:5px 0 10px">Your full image will be fitted without cropping.</div>
        <button class="btn small" id="uploadProfileBtn">Upload Photo</button>
        ${data.photo?`<button class="btn small danger" id="removeProfileBtn">Remove</button>`:""}
      </div>
      <div style="height:18px"></div>
      ${field("Full name","name",data.name,"Your name")}
      ${field("Professional title","role",data.role,"e.g. Graphic Designer")}
      ${area("About you","bio",data.bio,"Write a short professional introduction")}
      <div class="field-row">
        ${field("Email address","email",data.email,"you@example.com","email")}
        ${field("Phone number","phone",data.phone,"Your phone")}
      </div>
      <div class="field-row">
        ${field("Location","location",data.location,"City, Country")}
        ${field("Website / LinkedIn","website",data.website,"yourwebsite.com")}
      </div>`+actionButtons(true,true);
  }

  if(currentStep===2){

/* ---------------------------------------
   STEP EVENT HANDLERS
--------------------------------------- */
function bindStepEvents(){
  $("editorContent").querySelectorAll("[data-template]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.template=btn.dataset.template;
      renderStep();
    });
  });

  $("editorContent").querySelectorAll("[data-color]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.accent=btn.dataset.color;
      renderStep();
    });
  });

  $("editorContent").querySelectorAll("input[id],textarea[id],select[id]").forEach(input=>{
    input.addEventListener("input",()=>updateField(input.id,input.value));
    input.addEventListener("change",()=>updateField(input.id,input.value));
  });

  const back=$("backBtn"),next=$("nextBtn");
  if(back) back.addEventListener("click",()=>goStep(Math.max(0,currentStep-1)));
  if(next) next.addEventListener("click",()=>goStep(Math.min(6,currentStep+1)));

  const addSkill=$("addSkillBtn");
  if(addSkill) addSkill.addEventListener("click",addSkillFromInput);
  const skillInput=$("skillInput");
  if(skillInput) skillInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addSkillFromInput()}});

  $("editorContent").querySelectorAll("[data-remove-skill]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.skills.splice(Number(btn.dataset.removeSkill),1);renderStep();
    });
  });

  const addExp=$("addExperienceBtn");
  if(addExp) addExp.addEventListener("click",()=>{
    data.experiences.push({role:"",company:"",date:"",description:""});renderStep();
  });
  $("editorContent").querySelectorAll("[data-delete-exp]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.experiences.splice(Number(btn.dataset.deleteExp),1);renderStep();
    });
  });

  const addEdu=$("addEducationBtn");
  if(addEdu) addEdu.addEventListener("click",()=>{
    data.education.push({degree:"",school:"",date:"",description:""});renderStep();
  });
  $("editorContent").querySelectorAll("[data-delete-edu]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.education.splice(Number(btn.dataset.deleteEdu),1);renderStep();
    });
  });

  const addProject=$("addProjectBtn");
  if(addProject) addProject.addEventListener("click",()=>{
    data.projects.push({title:"",category:"",description:"",image:""});renderStep();
  });
  $("editorContent").querySelectorAll("[data-delete-project]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.projects.splice(Number(btn.dataset.deleteProject),1);renderStep();
    });
  });
  $("editorContent").querySelectorAll("[data-project-up]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      moveItem(data.projects,Number(btn.dataset.projectUp),-1);renderStep();
    });
  });
  $("editorContent").querySelectorAll("[data-project-down]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      moveItem(data.projects,Number(btn.dataset.projectDown),1);renderStep();
    });
  });
  $("editorContent").querySelectorAll("[data-upload-project]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      activeProjectIndex=Number(btn.dataset.uploadProject);
      $("projectFile").click();
    });
  });
  $("editorContent").querySelectorAll("[data-remove-project-image]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      data.projects[Number(btn.dataset.removeProjectImage)].image="";renderStep();
    });
  });

  const upload=$("uploadProfileBtn");
  if(upload) upload.addEventListener("click",()=>$("profileFile").click());
  const remove=$("removeProfileBtn");
  if(remove) remove.addEventListener("click",()=>{data.photo="";renderStep()});

  const fontSelect=$("fontSelect");
  if(fontSelect) fontSelect.addEventListener("change",()=>{data.font=fontSelect.value;renderPreview()});

  const htmlBtn=$("downloadHtmlBtn");
  if(htmlBtn) htmlBtn.addEventListener("click",downloadWebsite);
  const pdfBtn=$("downloadPdfBtn");
  if(pdfBtn) pdfBtn.addEventListener("click",exportPDF);
}
function updateField(id,value){
  if(["name","role","bio","email","phone","location","website"].includes(id)){
    data[id]=value;
  }else if(id.startsWith("exp-")){
    const [,key,index]=id.match(/^exp-(role|company|date|desc)-(\d+)$/)||[];
    if(key!==undefined){
      const prop={role:"role",company:"company",date:"date",desc:"description"}[key];
      if(data.experiences[index]) data.experiences[index][prop]=value;
    }
  }else if(id.startsWith("edu-")){
    const [,key,index]=id.match(/^edu-(degree|school|date|desc)-(\d+)$/)||[];
    if(key!==undefined){
      const prop={degree:"degree",school:"school",date:"date",desc:"description"}[key];
      if(data.education[index]) data.education[index][prop]=value;
    }
  }else if(id.startsWith("project-")){
    const [,key,index]=id.match(/^project-(title|category|desc)-(\d+)$/)||[];
    if(key!==undefined){
      const prop={title:"title",category:"category",desc:"description"}[key];
      if(data.projects[index]) data.projects[index][prop]=value;
    }
  }
  renderPreview();
}
function addSkillFromInput(){
  const input=$("skillInput");
  const value=input.value.trim();
  if(value && !data.skills.some(s=>s.toLowerCase()===value.toLowerCase())){
    data.skills.push(value);
    renderStep();
  }
}
function moveItem(array,index,direction){
  const target=index+direction;
  if(target<0||target>=array.length)return;
  [array[index],array[target]]=[array[target],array[index]];
}

/* ---------------------------------------
   IMAGE UPLOADS
--------------------------------------- */
function readImage(file,callback){
  if(!file || !file.type.startsWith("image/")) return;
  if(file.size>5*1024*1024){
    alert("Please choose an image smaller than 5 MB.");
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1100;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL("image/jpeg",.82));
    };
    img.onerror=()=>alert("This image could not be opened.");
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
$("profileFile").addEventListener("change",e=>{
  readImage(e.target.files[0],image=>{
    data.photo=image;renderStep();
  });
  e.target.value="";
});
$("projectFile").addEventListener("change",e=>{
  readImage(e.target.files[0],image=>{
    if(data.projects[activeProjectIndex]){
      data.projects[activeProjectIndex].image=image;renderStep();
    }
  });
  e.target.value="";
});

--------------------------------------- */
function saveDraft(showMessage=true){
  try{
    localStorage.setItem("portfolioBuilderProDraft",JSON.stringify(data));
    if(showMessage)setStatus("Draft saved on this device");
    return true;
  }catch(error){
    setStatus("Could not save draft");
    if(showMessage)alert("Your draft could not be saved. Try using smaller images.");
    return false;
  }
}
function loadDraft(){
  try{
    const saved=localStorage.getItem("portfolioBuilderProDraft");
    if(!saved)return false;
    const parsed=JSON.parse(saved);
    if(!parsed||typeof parsed!=="object")return false;
    data={...JSON.parse(JSON.stringify(sampleData)),...parsed};
    data.skills=Array.isArray(data.skills)?data.skills:[];
    data.experiences=Array.isArray(data.experiences)?data.experiences:[];
    data.education=Array.isArray(data.education)?data.education:[];
    data.projects=Array.isArray(data.projects)?data.projects:[];
    return true;
  }catch(error){return false}
}
$("saveBtn").addEventListener("click",()=>saveDraft());
$("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset your portfolio to the original sample? Your current edits will be replaced.")){
    data=JSON.parse(JSON.stringify(sampleData));
    currentStep=0;
    renderStep();
    setStatus("Sample portfolio restored");
  }
});

function downloadWebsite(){
  renderPreview();
  const portfolioHTML=$("portfolioPreview").outerHTML;
  const title=escapeHTML(data.name||"My Portfolio");
  const html=`<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="${escapeHTML((data.role||"Professional portfolio")+" — "+(data.name||""))}">
<title>${title} | Portfolio</title>
<style>${getExportCSS()}</style></head>
<body>${portfolioHTML}</body></html>`;
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(data.name||"my-portfolio").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  setStatus("Website HTML downloaded");
}
