<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb">
<title>Portfolio Showcase Studio</title>
<style>
:root{
  --blue:#315efb;--ink:#172033;--muted:#6d778b;
  --line:#e7eaf0;--surface:#fff;--bg:#f5f7fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:20}
.brand{font-weight:850;font-size:19px;letter-spacing:-.5px}
.brand span{color:var(--blue)}
.top-actions{display:flex;gap:9px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:10px 15px;border-radius:9px;font-weight:700;font-size:13px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.dark{background:#172033;color:#fff;border-color:#172033}
.btn:hover{filter:brightness(.96)}
.app{display:grid;grid-template-columns:220px minmax(280px,420px) minmax(400px,1fr);
  gap:16px;padding:18px;max-width:1800px;margin:auto;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden}
.panel-head{padding:17px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;margin:0}
.panel-head p{font-size:12px;color:var(--muted);margin:6px 0 0}
.steps{padding:12px}
.step{width:100%;display:flex;align-items:center;gap:11px;
  border:0;background:transparent;text-align:left;padding:12px;
  border-radius:9px;color:#536078;font-weight:650;font-size:13px;margin:2px 0}
.step .num{width:26px;height:26px;border-radius:8px;background:#f0f2f7;
  display:grid;place-items:center;font-size:11px}
.step.active{background:#eef2ff;color:var(--blue)}
.step.active .num{background:var(--blue);color:#fff}
.side-note{margin:12px;padding:13px;background:#f7f8fc;border-radius:10px;
  color:#657087;font-size:11px;line-height:1.6}
.editor{padding:18px}
.editor h3{font-size:17px;margin:0 0 5px}
.editor .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 18px}
.field{margin:0 0 15px}
.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;border:1px solid #dfe3eb;
  border-radius:8px;background:#fff;color:#172033;outline:none;
  font-size:13px;min-width:0}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{min-height:82px;resize:vertical;line-height:1.5}
.field small{display:block;color:#8992a3;font-size:10px;margin-top:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload{border:1.5px dashed #cbd2e0;border-radius:10px;padding:13px;
  background:#fafbfe}
.upload input{border:0;padding:5px 0;background:transparent}
.upload-preview{width:100%;height:100px;object-fit:contain;
  display:none;background:#f0f2f7;border-radius:8px;margin-top:9px}
.editor-actions{display:flex;justify-content:space-between;gap:8px;
  border-top:1px solid var(--line);padding-top:15px;margin-top:20px}
.preview-panel{position:sticky;top:84px}
.preview-head{display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;border-bottom:1px solid var(--line);gap:8px}
.preview-head strong{font-size:13px}
.preview-head span{font-size:11px;color:var(--muted)}
.preview-scroll{padding:12px;background:#e9edf5;max-height:calc(100vh - 145px);
  overflow:auto}
.portfolio{background:#fff;min-height:650px;overflow:hidden;
  box-shadow:0 5px 24px #1a274015;color:#172033}
.portfolio.dark{background:#101116;color:#f5f5f5}
.portfolio.editorial{background:#f8f5ef;color:#222}
.portfolio.studio{background:#f4f6fa;color:#172033}
.portfolio a{color:inherit}
.p-nav{display:flex;align-items:center;justify-content:space-between;
  padding:23px 6%;font-size:12px;gap:12px}
.p-logo{font-weight:850;font-size:15px;letter-spacing:-.5px}
.p-navlinks{display:flex;gap:18px;flex-wrap:wrap}
.p-navlinks a{text-decoration:none;color:inherit;opacity:.75}
.p-hero{padding:65px 7% 55px;display:grid;grid-template-columns:1.1fr .9fr;
  gap:35px;align-items:center;min-height:340px}
.p-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--blue);font-weight:800;margin-bottom:15px}
.p-hero h1{font-size:clamp(35px,5vw,65px);line-height:1.02;
  letter-spacing:-2.7px;margin:0 0 18px;overflow-wrap:anywhere}
.p-hero p{font-size:14px;line-height:1.8;opacity:.72;max-width:520px}
.p-hero-image{height:270px;width:100%;object-fit:contain;
  background:#e9edf3;border-radius:12px}
.dark .p-hero-image{background:#20232b}
.p-cta{display:inline-block;background:var(--blue);color:#fff!important;
  padding:12px 19px;border-radius:5px;text-decoration:none;
  font-size:11px;font-weight:800;margin-top:12px}
.p-section{padding:45px 7%}
.p-section-head{display:flex;align-items:end;justify-content:space-between;
  gap:15px;margin-bottom:23px}
.p-section-head h2{font-size:clamp(25px,3vw,38px);letter-spacing:-1.3px;
  margin:0}
.p-section-head p{font-size:12px;opacity:.65;max-width:300px;line-height:1.6}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.project-card{min-width:0}
.project-image{height:190px;width:100%;object-fit:contain;
  background:#e8ebf1;border-radius:8px;display:block}
.dark .project-image{background:#24262d}
.project-card h3{font-size:17px;margin:13px 0 6px}
.project-card p{font-size:12px;line-height:1.65;opacity:.68;margin:0}
.project-meta{font-size:10px;opacity:.55;margin-top:9px}
.about-layout{display:grid;grid-template-columns:170px 1fr;gap:30px;align-items:center}
.about-photo{width:160px;height:160px;border-radius:50%;object-fit:contain;
  background:#e7eaf0;border:5px solid #fff;box-shadow:0 4px 20px #0001}
.dark .about-photo{border-color:#25262c;background:#292b33}
.about-copy h2{font-size:30px;margin:0 0 10px;letter-spacing:-1px}
.about-copy p{font-size:13px;line-height:1.8;opacity:.72}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.service-item{padding:18px 0;border-top:1px solid #9995}
.service-item h3{font-size:14px;margin:0 0 8px}
.service-item p{font-size:11px;line-height:1.6;opacity:.65}
.testimonial{font-size:22px;line-height:1.5;max-width:680px;letter-spacing:-.5px}
.contact-section{background:#edf1f8;color:#172033}
.dark .contact-section{background:#1c1e25;color:#fff}
.contact-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.contact-links a{padding:10px 13px;border:1px solid #9996;
  border-radius:5px;text-decoration:none;font-size:11px;font-weight:700}
.p-footer{padding:22px 7%;font-size:10px;opacity:.6;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty-image{display:grid;place-items:center;color:#8b94a5;font-size:12px;
  border:1px dashed #b9c1ce}
.hidden{display:none!important}
.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px #ccd1dc;cursor:pointer}
.color-dot.selected{box-shadow:0 0 0 2px var(--blue)}
.mobile-tabs{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#172033;color:#fff;padding:12px 18px;border-radius:9px;
  font-size:12px;z-index:99;box-shadow:0 5px 20px #0003}
@media(max-width:1100px){
 .app{grid-template-columns:190px minmax(260px,380px) minmax(330px,1fr);gap:10px;padding:10px}
 .p-hero{padding:45px 6%}
}
@media(max-width:800px){
 .topbar{padding:0 12px;height:60px}
 .top-actions .btn{padding:9px 10px;font-size:11px}
 .app{display:flex;flex-direction:column;padding:10px;width:100%}
 .steps-panel{width:100%}
 .steps{display:flex;overflow-x:auto;gap:5px;padding:9px}
 .step{min-width:max-content;width:auto;margin:0;padding:8px}
 .step .num{width:23px;height:23px}
 .side-note{display:none}
 .editor-panel{width:100%}
 .preview-panel{position:static;width:100%}
 .preview-scroll{max-height:none;padding:7px}
 .mobile-tabs{display:flex;gap:7px;padding:9px;background:#fff;
   border-bottom:1px solid var(--line)}
 .mobile-tabs button{flex:1;padding:9px;border:1px solid var(--line);
   border-radius:7px;background:#fff;font-size:11px;font-weight:700}
 .mobile-tabs button.active{background:#eef2ff;color:var(--blue)}
}
@media(max-width:520px){
 .brand{font-size:16px}
 .top-actions{gap:5px}
 .top-actions .btn{padding:8px;font-size:10px}
 .p-nav{padding:17px 5%;align-items:flex-start}
 .p-navlinks{gap:9px;font-size:9px;justify-content:flex-end}
 .p-logo{font-size:12px}
 .p-hero{grid-template-columns:1fr;padding:36px 6%;gap:20px}
 .p-hero h1{font-size:39px;letter-spacing:-1.7px}
 .p-hero-image{height:210px}
 .p-section{padding:32px 6%}
 .p-section-head{display:block}
 .p-section-head p{margin-top:8px}
 .project-grid{grid-template-columns:1fr;gap:20px}
 .project-image{height:190px}
 .about-layout{grid-template-columns:1fr;text-align:center;justify-items:center;gap:15px}
 .about-photo{width:135px;height:135px}
 .about-copy h2{font-size:25px}
 .services-grid{grid-template-columns:1fr}
 .testimonial{font-size:18px}
 .field-row{grid-template-columns:1fr}
}
@media print{
 @page{size:A4;margin:10mm}
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .portfolio{box-shadow:none!important;width:100%!important;min-height:0!important}
 .p-hero,.p-section,.contact-section,.p-footer,.project-card,.about-layout{
   break-inside:avoid;page-break-inside:avoid}
 .p-hero-image,.project-image,.about-photo{
   -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Portfolio <span>Studio</span></div>
  <div class="top-actions">
    <button class="btn" id="saveBtn">Save Draft</button>
    <button class="btn" id="pdfBtn">Download PDF</button>
    <button class="btn primary" id="exportBtn">Export Website</button>
  </div>
</header>

<main class="app">
  <aside class="panel steps-panel">
    <div class="panel-head">
      <h2>Build your portfolio</h2>
      <p>Create a personal showcase website</p>
    </div>
    <div class="steps" id="steps">
      <button class="step active" data-step="0"><span class="num">01</span> Style & Layout</button>
      <button class="step" data-step="1"><span class="num">02</span> Hero & Intro</button>
      <button class="step" data-step="2"><span class="num">03</span> Featured Projects</button>
      <button class="step" data-step="3"><span class="num">04</span> About & Story</button>
      <button class="step" data-step="4"><span class="num">05</span> Services</button>
      <button class="step" data-step="5"><span class="num">06</span> Contact & Links</button>
    </div>
    <div class="side-note">
      Your portfolio preview updates as you edit. Images up to 2 MB are supported.
      Export your finished work as a website or PDF.
    </div>
  </aside>

  <section class="panel editor-panel">
    <div class="mobile-tabs">
      <button class="active" id="editTab">Edit</button>
      <button id="previewTab">Preview</button>
    </div>
    <div class="editor" id="editor"></div>
  </section>

  <section class="panel preview-panel" id="previewPanel">
    <div class="preview-head">
      <strong>Live Website Preview</strong>
      <span>Responsive preview</span>
    </div>
    <div class="preview-scroll">
      <div id="portfolio" class="portfolio"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
const $=id=>document.getElementById(id);
const MAX_IMAGE=2*1024*1024;
let currentStep=0;

const state={
 template:"creative",accent:"#315efb",name:"Alex Morgan",
 logo:"Alex Morgan",role:"Independent Creative Professional",
 headline:"Ideas into meaningful digital experiences.",
 intro:"I create thoughtful digital experiences, visual stories and projects that make an impact.",
 heroImage:"",heroButton:"Explore My Work",
 projectsIntro:"",
 projects:[
  {title:"Brand Identity Design",description:"A visual identity created to give a growing brand a distinctive and memorable presence.",category:"Branding & Design",image:"",link:""},
  {title:"Digital Experience",description:"A clean and engaging digital experience focused on clarity, usability and modern design.",category:"Digital Project",image:"",link:""},
  {title:"Creative Exploration",description:"An independent creative project exploring new ideas, visual direction and storytelling.",category:"Creative Work",image:"",link:""}
 ],
 aboutTitle:"A little about me",
 about:"I enjoy turning ideas into meaningful work. My approach combines curiosity, thoughtful planning and attention to detail. I believe good work should be useful, clear and memorable.",
 profileImage:"",
 services:[
  {title:"Creative Direction",description:"Developing a clear visual direction and turning ideas into a consistent experience."},
  {title:"Digital Projects",description:"Building useful digital experiences with a focus on quality and simplicity."},
  {title:"Consultation",description:"Helping individuals and teams shape ideas into practical solutions."}
 ],
 testimonial:"",
 email:"",phone:"",whatsapp:"",website:"",
 instagram:"",linkedin:"",behance:"",github:"",otherLink:"",otherLabel:""
};

function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(value){
 let v=String(value||"").trim();
 if(!v)return "";
 if(/^https?:\/\//i.test(v))return v;
 if(/^mailto:/i.test(v)||/^tel:/i.test(v))return v;
 return "https://"+v;
}
function linkHtml(url,label){
 if(!url)return "";
 return `<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
function toast(message){
 const t=$("toast");t.textContent=message;t.classList.remove("hidden");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.classList.add("hidden"),2600);
}
function field(label,key,value,placeholder="",type="text"){
 return `<div class="field"><label>${label}</label>
 <input type="${type}" data-key="${key}" value="${esc(value||"")}" placeholder="${esc(placeholder)}"></div>`;
}
function textarea(label,key,value,placeholder=""){
 return `<div class="field"><label>${label}</label>
 <textarea data-key="${key}" placeholder="${esc(placeholder)}">${esc(value||"")}</textarea></div>`;
}
function uploadField(label,key,value){
 return `<div class="field"><label>${label}</label>
 <div class="upload">
 <input type="file" accept="image/*" data-upload="${key}">
 <small>Maximum image size: 2 MB. Image will fit inside its display area without cropping.</small>
 <img class="upload-preview" id="uploadPreview-${key}" src="${value||""}" style="${value?"display:block":""}">
 </div></div>`;
}
function renderEditor(){
 document.querySelectorAll(".step").forEach(b=>b.classList.toggle("active",+b.dataset.step===currentStep));
 let html="";
 if(currentStep===0){
  html=`<h3>Choose your visual style</h3><p class="hint">Choose a portfolio look. Each style changes the presentation of your website.</p>
  <div class="field"><label>Portfolio style</label><select data-key="template">
   <option value="creative">Creative Showcase</option>
   <option value="editorial">Editorial Minimal</option>
   <option value="studio">Modern Studio</option>
   <option value="dark">Dark Portfolio</option>
  </select></div>
  <div class="field"><label>Accent colour</label><div class="color-row">
   ${["#315efb","#7c4dff","#e45d45","#0b927c","#d19b35","#111827"].map(c=>
    `<button class="color-dot ${state.accent===c?"selected":""}" style="background:${c}" data-color="${c}" aria-label="${c}"></button>`).join("")}
  </div></div>
  ${field("Your name / brand","name",state.name,"Your name")}
  ${field("Navbar brand name","logo",state.logo,"Brand name")}
  <p class="hint">Tip: Your selected style and accent colour are applied to the live preview and exported website.</p>`;
 }
 if(currentStep===1){
  html=`<h3>Hero & Introduction</h3><p class="hint">This is the first impression visitors will see. Add a strong headline and a visual that represents your work.</p>
  ${field("Small intro label (optional)","role",state.role,"e.g. Designer & Developer")}
  ${field("Main headline","headline",state.headline,"Write a memorable headline")}
  ${textarea("Introduction","intro",state.intro,"Tell visitors what you create and what you do.")}
  ${uploadField("Hero image","heroImage",state.heroImage)}
  ${field("Button text","heroButton",state.heroButton,"Explore my work")}`;
 }
 if(currentStep===2){
  html=`<h3>Featured Projects</h3><p class="hint">Show your best work visually. Add project images, a short explanation and an optional project link.</p>
  ${textarea("Section introduction (optional)","projectsIntro",state.projectsIntro,"")}
  <div id="projectEditor">${state.projects.map((p,i)=>`
   <div style="border:1px solid #e7eaf0;border-radius:10px;padding:13px;margin:0 0 13px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
     <strong style="font-size:13px">Project ${i+1}</strong>
     <button class="btn" data-remove-project="${i}" ${state.projects.length===1?"disabled":""}>Remove</button>
    </div>
    <div class="field"><label>Project title</label><input data-project="${i}" data-prop="title" value="${esc(p.title)}" placeholder="Project title"></div>
    <div class="field"><label>Category / type</label><input data-project="${i}" data-prop="category" value="${esc(p.category)}" placeholder="Design, development, photography..."></div>
    <div class="field"><label>Project description</label><textarea data-project="${i}" data-prop="description" placeholder="Describe this project">${esc(p.description)}</textarea></div>
    <div class="field"><label>Project image</label><div class="upload">
     <input type="file" accept="image/*" data-project-upload="${i}">
     <small>Maximum 2 MB. Full image will fit without cropping.</small>
     ${p.image?`<img src="${p.image}" style="width:100%;height:100px;object-fit:contain;background:#f0f2f7;border-radius:8px;margin-top:8px">`:""}
    </div></div>
    <div class="field"><label>Project URL (optional)</label><input data-project="${i}" data-prop="link" value="${esc(p.link)}" placeholder="https://example.com"></div>
   </div>`).join("")}</div>
   <button class="btn primary" id="addProject">+ Add another project</button>`;
 }
 if(currentStep===3){
  html=`<h3>About & Story</h3><p class="hint">Introduce yourself with a personal story. Your profile photo will appear in a circular frame.</p>
  ${uploadField("Round profile image","profileImage",state.profileImage)}
  ${field("Section heading","aboutTitle",state.aboutTitle,"A little about me")}
  ${textarea("Your story","about",state.about,"Share your background, approach and interests.")}`;
 }
 if(currentStep===4){
  html=`<h3>Services & Expertise</h3><p class="hint">Describe the services, skills or areas of work you want visitors to notice.</p>
  ${state.services.map((s,i)=>`
   <div style="border:1px solid #e7eaf0;border-radius:10px;padding:13px;margin-bottom:12px">
    <strong style="font-size:13px">Service ${i+1}</strong>
    <div class="field" style="margin-top:12px"><label>Title</label><input data-service="${i}" data-prop="title" value="${esc(s.title)}"></div>
    <div class="field"><label>Description</label><textarea data-service="${i}" data-prop="description">${esc(s.description)}</textarea></div>
   </div>`).join("")}
  <button class="btn" id="addService">+ Add service</button>
  ${textarea("Optional testimonial / quote","testimonial",state.testimonial,"Add a client or mentor quote if you have one.")}`;
 }
 if(currentStep===5){
  html=`<h3>Contact & Social Links</h3><p class="hint">Add your real contact details and social profiles. Only filled fields will appear on your portfolio.</p>
  ${field("Email address","email",state.email,"you@example.com","email")}
  ${field("Phone number","phone",state.phone,"+92 300 1234567","tel")}
  ${field("WhatsApp number","whatsapp",state.whatsapp,"923001234567")}
  ${field("Personal website","website",state.website,"https://yourwebsite.com")}
  <hr style="border:0;border-top:1px solid #e7eaf0;margin:18px 0">
  <strong style="font-size:13px">Social profiles</strong>
  ${field("Instagram URL","instagram",state.instagram,"https://instagram.com/username")}
  ${field("LinkedIn URL","linkedin",state.linkedin,"https://linkedin.com/in/username")}
  ${field("Behance URL","behance",state.behance,"https://behance.net/username")}
  ${field("GitHub URL","github",state.github,"https://github.com/username")}
  ${field("Other link URL","otherLink",state.otherLink,"https://example.com")}
  ${field("Other link label","otherLabel",state.otherLabel,"My profile")}`;
 }
 $("editor").innerHTML=html+`
 <div class="editor-actions">
  <button class="btn" id="backBtn" ${currentStep===0?"disabled":""}>Back</button>
  <button class="btn primary" id="nextBtn">${currentStep===5?"Finish":"Continue"}</button>
 </div>`;
 const select=$("editor").querySelector('[data-key="template"]');
 if(select)select.value=state.template;
 $("editor").querySelectorAll("[data-key]").forEach(el=>{
  el.addEventListener("input",()=>{
   state[el.dataset.key]=el.value;
   renderPreview();
  });
  el.addEventListener("change",()=>{
   state[el.dataset.key]=el.value;
   renderPreview();
  });
 });
 $("editor").querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{
  state.accent=b.dataset.color;renderEditor();renderPreview();
 });
 $("editor").querySelectorAll("[data-upload]").forEach(el=>el.onchange=()=>handleImage(el.files[0],el.dataset.upload));
 $("editor").querySelectorAll("[data-project]").forEach(el=>el.addEventListener("input",()=>{
  state.projects[+el.dataset.project][el.dataset.prop]=el.value;renderPreview();
 }));
 $("editor").querySelectorAll("[data-project-upload]").forEach(el=>el.onchange=()=>{
  const i=+el.dataset.projectUpload;
  handleProjectImage(el.files[0],i);
 });
 $("editor").querySelectorAll("[data-service]").forEach(el=>el.addEventListener("input",()=>{
  state.services[+el.dataset.service][el.dataset.prop]=el.value;renderPreview();
 }));
 $("editor").querySelectorAll("[data-remove-project]").forEach(b=>b.onclick=()=>{
  state.projects.splice(+b.dataset.removeProject,1);renderEditor();renderPreview();
 });
 if($("addProject"))$("addProject").onclick=()=>{
  state.projects.push({title:"New Project",description:"",category:"Creative Work",image:"",link:""});
  renderEditor();renderPreview();
 };
 if($("addService"))$("addService").onclick=()=>{
  state.services.push({title:"New Service",description:"Describe this service."});
  renderEditor();renderPreview();
 };
 $("backBtn").onclick=()=>{if(currentStep>0){currentStep--;renderEditor()}};
 $("nextBtn").onclick=()=>{if(currentStep<5){currentStep++;renderEditor()}else{toast("Your portfolio details are ready. Review the preview.")}};
}
function readImage(file){
 return new Promise((resolve,reject)=>{
  if(!file)return reject("Please select an image.");
  if(!file.type.startsWith("image/"))return reject("Please choose an image file.");
  if(file.size>MAX_IMAGE)return reject("Image is larger than 2 MB. Please choose a smaller image.");
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject("Image could not be read.");
  reader.readAsDataURL(file);
 });
}
async function handleImage(file,key){
 try{
  const data=await readImage(file);
  state[key]=data;
  renderEditor();renderPreview();
  toast("Image added and displayed successfully.");
 }catch(e){toast(String(e))}
}
async function handleProjectImage(file,index){
 try{
  state.projects[index].image=await readImage(file);
  renderEditor();renderPreview();toast("Project image added successfully.");
 }catch(e){toast(String(e))}
}
function imageOrPlaceholder(src,cls,alt){
 return src?`<img class="${cls}" src="${src}" alt="${esc(alt)}">`:
 `<div class="${cls} empty-image">Add your image</div>`;
}
function renderPreview(){
 const dark=state.template==="dark";
 const cls=state.template==="editorial"?"editorial":state.template==="studio"?"studio":dark?"dark":"";
 const projects=state.projects.filter(p=>p.title||p.description||p.image);
 const contact=[];
 if(state.email)contact.push(linkHtml("mailto:"+state.email,"Email me"));
 if(state.phone)contact.push(linkHtml("tel:"+state.phone,"Call me"));
 if(state.whatsapp)contact.push(linkHtml("https://wa.me/"+state.whatsapp.replace(/\D/g,""),"WhatsApp"));
 if(state.website)contact.push(linkHtml(state.website,"Website"));
 const socials=[
  ["instagram","Instagram"],["linkedin","LinkedIn"],["behance","Behance"],
  ["github","GitHub"],["otherLink",state.otherLabel||"More"]
 ].filter(([key])=>state[key]).map(([key,label])=>linkHtml(state[key],label));
 $("portfolio").className="portfolio "+cls;
 $("portfolio").style.setProperty("--blue",state.accent);
 $("portfolio").innerHTML=`
 <nav class="p-nav">
  <div class="p-logo">${esc(state.logo||state.name)}</div>
  <div class="p-navlinks">
   <a href="#work">Work</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a>
  </div>
 </nav>
 <section class="p-hero">
  <div>
   ${state.role?`<div class="p-kicker">${esc(state.role)}</div>`:""}
   <h1>${esc(state.headline)}</h1>
   <p>${esc(state.intro)}</p>
   <a class="p-cta" href="#work">${esc(state.heroButton||"Explore My Work")}</a>
  </div>
  ${imageOrPlaceholder(state.heroImage,"p-hero-image","Portfolio introduction image")}
 </section>
 <section class="p-section" id="work">
  <div class="p-section-head"><h2>Selected Work</h2>
   ${state.projectsIntro?`<p>${esc(state.projectsIntro)}</p>`:""}
  </div>
  <div class="project-grid">${projects.map((p,i)=>`
   <article class="project-card">
    ${imageOrPlaceholder(p.image,"project-image",p.title)}
    <h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
    <div class="project-meta">${esc(p.category)}</div>
    ${p.link?`<p style="margin-top:10px"><a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">View project ↗</a></p>`:""}
   </article>`).join("")}</div>
 </section>
 <section class="p-section" id="about">
  <div class="about-layout">
   ${imageOrPlaceholder(state.profileImage,"about-photo","Profile portrait")}
   <div class="about-copy"><div class="p-kicker">The person behind the work</div>
    <h2>${esc(state.aboutTitle)}</h2><p>${esc(state.about)}</p>
   </div>
  </div>
 </section>
 <section class="p-section" id="services">
  <div class="p-section-head"><h2>What I do</h2></div>
  <div class="services-grid">${state.services.map(s=>`
   <div class="service-item"><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p></div>`).join("")}</div>
  ${state.testimonial?`<div style="margin-top:35px"><div class="p-kicker">A kind word</div><div class="testimonial">“${esc(state.testimonial)}”</div></div>`:""}
 </section>
 <section class="p-section contact-section" id="contact">
  <div class="p-kicker">Get in touch</div><div class="p-section-head"><h2>Have a project in mind?</h2></div>
  <p style="font-size:13px;line-height:1.7;opacity:.7">Let's connect and talk about what we can create together.</p>
  <div class="contact-links">${contact.join("")}${socials.join("")}</div>
 </section>
 <footer class="p-footer"><span>© ${new Date().getFullYear()} ${esc(state.name)}. All rights reserved.</span><span>Personal Portfolio</span></footer>`;
}
function saveDraft(){
 try{
  localStorage.setItem("portfolioShowcaseDraftV2",JSON.stringify(state));
  toast("Draft saved on this device.");
 }catch(e){toast("Draft could not be saved. Your images may exceed browser storage limits.")}
}
function loadDraft(){
 try{
  const saved=localStorage.getItem("portfolioShowcaseDraftV2");
  if(saved){Object.assign(state,JSON.parse(saved));}
 }catch(e){console.warn("Draft load failed",e)}
}
function exportHTML(){
 const content=$("portfolio").outerHTML;
 const css=[...document.querySelectorAll("style")].map(s=>s.innerHTML).join("\n");
 const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>${esc(state.name)} | Portfolio</title>
 <meta name="description" content="${esc(state.intro.slice(0,155))}">
 <style>${css}
 body{margin:0;background:#fff;padding:0}
 .portfolio{max-width:1440px;margin:auto;box-shadow:none}
 html{scroll-behavior:smooth}
 </style></head><body>${content}</body></html>`;
 const blob=new Blob([doc],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;
 a.download=(state.name||"my") .toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-portfolio.html";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
 toast("Website HTML exported. Publish this file to get a public shareable link.");
}
function downloadPDF(){
 const content=$("portfolio").outerHTML;
 const css=[...document.querySelectorAll("style")].map(s=>s.innerHTML).join("\n");
 const win=window.open("","_blank");
 if(!win){toast("Please allow pop-ups to download your PDF.");return}
 win.document.open();
 win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>${esc(state.name)} - Portfolio</title><style>${css}
 html,body{margin:0;padding:0;background:#fff}
 body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .portfolio{box-shadow:none!important;max-width:none!important}
 img{max-width:100%;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 @page{size:A4;margin:10mm}
 </style></head><body>${content}
 <script>window.onload=()=>setTimeout(()=>window.print(),700);<\/script>
 </body></html>`);
 win.document.close();
}
$("steps").addEventListener("click",e=>{
 const b=e.target.closest("[data-step]");
 if(b){currentStep=+b.dataset.step;renderEditor()}
});
$("saveBtn").onclick=saveDraft;
$("exportBtn").onclick=exportHTML;
$("pdfBtn").onclick=downloadPDF;
$("editTab").onclick=()=>{
 $("editor").style.display="block";$("previewPanel").style.display="none";
 $("editTab").classList.add("active");$("previewTab").classList.remove("active");
};
$("previewTab").onclick=()=>{
 $("editor").style.display="none";$("previewPanel").style.display="block";
 $("previewTab").classList.add("active");$("editTab").classList.remove("active");
};
loadDraft();
renderEditor();
renderPreview();
</script>
</body>
